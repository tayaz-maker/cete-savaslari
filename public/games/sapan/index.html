<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0c0b" />
    <title>Sapan | TLab</title>
    <style>
      :root {
        --bg: #0e0c0b;
        --fg: #efe8de;
        --muted: #c4b8ac;
        --surface: #171412;
        --accent: #d8d0c4;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: Barlow, "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        right: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        pointer-events: none;
        z-index: 2;
      }
      #hud p {
        margin: 0;
        font-size: 0.82rem;
        color: var(--muted);
      }
      #hud strong {
        color: var(--fg);
        font-size: 1.05rem;
      }
      button {
        pointer-events: auto;
        min-height: 44px;
        min-width: 44px;
        padding: 0 14px;
        border: 0;
        border-radius: 10px;
        background: var(--surface);
        color: var(--fg);
        box-shadow: 0 0 0 1px rgba(239, 232, 222, 0.12);
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <p>
        <strong>Sapan</strong><br />
        Çek ve bırak · <span id="skor">0</span> yıkım
      </p>
      <button type="button" id="yeniden">Yeniden</button>
    </div>
    <script src="matter.js"></script>
    <script>
      (function () {
        const Engine = Matter.Engine;
        const Render = Matter.Render;
        const World = Matter.World;
        const Bodies = Matter.Bodies;
        const Body = Matter.Body;
        const Composite = Matter.Composite;
        const Composites = Matter.Composites;
        const Constraint = Matter.Constraint;
        const Mouse = Matter.Mouse;
        const MouseConstraint = Matter.MouseConstraint;
        const Events = Matter.Events;
        const Runner = Matter.Runner;

        const PALETTE = ["#c45c4a", "#b08968", "#7a9a7e", "#d8d0c4", "#8a7a6c"];
        let engine, render, runner, mouse, sling, projectile, stack, ground;
        let anchor = { x: 160, y: 420 };
        let firing = false;
        let knocked = 0;
        const seen = new WeakSet();

        function colorize(body) {
          body.render.fillStyle = PALETTE[(Math.random() * PALETTE.length) | 0];
          body.render.strokeStyle = "#000";
          body.render.lineWidth = 1;
        }

        function size() {
          return { w: Math.max(320, window.innerWidth), h: Math.max(280, window.innerHeight) };
        }

        function spawnProjectile() {
          projectile = Bodies.circle(anchor.x, anchor.y, 16, {
            density: 0.004,
            restitution: 0.6,
            friction: 0.05,
          });
          colorize(projectile);
          projectile.label = "shot";
          World.add(engine.world, projectile);
          sling.bodyB = projectile;
        }

        function build() {
          const { w, h } = size();
          if (engine) {
            if (runner) Runner.stop(runner);
            Render.stop(render);
            World.clear(engine.world, false);
            Engine.clear(engine);
            if (render.canvas && render.canvas.parentNode) render.canvas.remove();
            render.textures = {};
          }
          knocked = 0;
          document.getElementById("skor").textContent = "0";

          engine = Engine.create();
          engine.world.gravity.y = 1.05;
          render = Render.create({
            element: document.body,
            engine: engine,
            options: {
              width: w,
              height: h,
              wireframes: false,
              background: "#0e0c0b",
              pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
            },
          });
          render.canvas.style.touchAction = "none";

          anchor = { x: Math.round(w * 0.18), y: Math.round(h * 0.68) };
          const gx = Math.round(w * 0.68);
          const gy = Math.round(h * 0.62);
          const gw = Math.min(560, Math.round(w * 0.5));

          ground = Bodies.rectangle(gx, gy, gw, 18, {
            isStatic: true,
            render: { fillStyle: "#2c2621", strokeStyle: "#000" },
          });
          const floor = Bodies.rectangle(w / 2, h + 40, w * 2, 80, {
            isStatic: true,
            render: { visible: false },
          });

          const cols = w < 520 ? 7 : 10;
          const rows = w < 520 ? 7 : 9;
          const startX = gx - (cols * 34) / 2;
          stack = Composites.stack(startX, 40, cols, rows, 0, 0, function (x, y) {
            const b = Bodies.polygon(x, y, 8, 16, { restitution: 0.05, friction: 0.4 });
            colorize(b);
            b.label = "block";
            return b;
          });

          sling = Constraint.create({
            pointA: { x: anchor.x, y: anchor.y },
            bodyB: Bodies.circle(anchor.x, anchor.y, 1, { render: { visible: false } }),
            stiffness: 0.05,
            render: { strokeStyle: "#d8d0c4", lineWidth: 2 },
          });

          mouse = Mouse.create(render.canvas);
          mouse.pixelRatio = render.options.pixelRatio;
          const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: { render: { visible: false }, stiffness: 0.2 },
          });
          render.mouse = mouse;

          World.add(engine.world, [stack, ground, floor, sling, mouseConstraint]);
          spawnProjectile();

          firing = false;
          Events.on(mouseConstraint, "enddrag", function (e) {
            if (e.body === projectile) firing = true;
          });
          Events.on(engine, "afterUpdate", function () {
            if (
              firing &&
              projectile &&
              Math.abs(projectile.position.x - anchor.x) < 22 &&
              Math.abs(projectile.position.y - anchor.y) < 22
            ) {
              firing = false;
              spawnProjectile();
            }
            const bodies = Composite.allBodies(stack);
            for (let i = 0; i < bodies.length; i++) {
              const b = bodies[i];
              if (seen.has(b)) continue;
              if (b.position.y > gy + 80 || b.position.x > w + 40 || b.position.x < -40) {
                seen.add(b);
                knocked += 1;
                document.getElementById("skor").textContent = String(knocked);
              }
            }
          });

          Render.run(render);
          runner = Runner.create();
          Runner.run(runner, engine);
        }

        document.getElementById("yeniden").addEventListener("click", build);
        window.addEventListener("resize", function () {
          clearTimeout(window.__sapanFit);
          window.__sapanFit = setTimeout(build, 180);
        });
        window.addEventListener("orientationchange", function () {
          setTimeout(build, 250);
        });
        build();
      })();
    </script>
  </body>
</html>
