name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Browser QA runs the compiled server under Node, as on Vercel. The
      # default Workers adapter cannot host the existing Node auth/DB bootstrap.
      # Deployment providers retain their own preset; no hosting setting changes.
      NITRO_PRESET: node-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium for responsive regression
        timeout-minutes: 5
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: Responsive and interaction regression (TR/EN, 14 live routes)
        timeout-minutes: 10
        run: node scripts/sitewide-responsive.mjs
      - name: Upload responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-responsive
          path: ${{ runner.temp }}/screenshots/tariklab-ux
