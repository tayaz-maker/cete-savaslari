name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium for responsive regression
        run: npx playwright install --with-deps chromium --only-shell
      - name: Responsive and interaction regression (TR/EN, 14 live routes)
        run: node scripts/sitewide-responsive.mjs
      - name: Upload responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-responsive
          path: ${{ runner.temp }}/screenshots/tariklab-ux
